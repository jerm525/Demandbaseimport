# Field mapping: source SQL view column -> Demandbase target field.
#
# *** DO NOT GO LIVE WITH THIS FILE UNCHANGED. ***
#
# Before first run in any environment:
#   1. Run `python scripts/introspect_view_schema.py --env <env>` (see
#      README) to print the view's real columns.
#   2. Replace every source_field... value below with the matching real column.
#   3. Run the app once -- validate_mapping() in mapping.py will refuse to
#      start if any source_field still doesn't exist in the view, which also
#      catches any source_field placeholder left behind by mistake.
#
# `target_field` values are the  Demandbase field names  Changing
# them is a one-line edit per row below -- nothing else in the codebase
# needs to change.

- source_field: SFDC_OpportunityId
  target_field: Opportunity ID
  transform: none
  required: true

- source_field: SFDC_OppName
  target_field: Opportunity Name
  transform: none
  required: true

- source_field: SFDC_OppType
  target_field: Type
  transform: none
  required: false
  default: ""

- source_field: CreatedDate
  target_field: Created Date
  transform: "date_format:%Y-%m-%d"
  required: true

- source_field: OwnerEmail
  target_field: Owner
  transform: none
  required: true
  default: ""

- source_field: SFDC_AccountId
  target_field: External Account ID
  transform: none
  required: false
  default: ""

- source_field: AccountName
  target_field: Account Name
  transform: none
  required: true

- source_field: Domain
  target_field: Account Domain
  transform: none
  required: false
  default: ""

- source_field: PipelineConsumption
  target_field: Projected Total Consumption Revenue
  transform: decimal_round_2
  required: false
  default: 0.0

