# Field mapping: source SQL view column -> Demandbase target field.
#
# *** DO NOT GO LIVE WITH THIS FILE UNCHANGED. ***
#
# `source_field` values below are PLACEHOLDERS (prefixed CHANGEME__) because
# this file was authored without a live connection to
# [marketing_bi].[EDA-268].[vw__demandbase_Opportunity_import]. The build
# prompt is explicit that column names must never be guessed.
#
# Before first run in any environment:
#   1. Run `python scripts/introspect_view_schema.py --env <env>` (see
#      README) to print the view's real columns.
#   2. Replace every CHANGEME__... value below with the matching real column.
#   3. Run the app once -- validate_mapping() in mapping.py will refuse to
#      start if any source_field still doesn't exist in the view, which also
#      catches any CHANGEME__ placeholder left behind by mistake.
#
# `target_field` values are the 25 Demandbase field names exactly as given in
# the build prompt. FLAGGED OPEN ITEM (see README): fields with spaces or
# punctuation ("Opportunity Name", "Is Closed?", "Is Won?", "AE Name",
# "Target Account") may be literal CSV headers Demandbase expects, or they
# may be display labels standing in for different machine keys. Changing
# them is a one-line edit per row below -- nothing else in the codebase
# needs to change.

- source_field: SFDC_OpportunityId
  target_field: recordTypeId
  transform: none
  required: true
